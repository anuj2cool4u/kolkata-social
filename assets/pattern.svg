<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!--
    Abstract composition inspired by Bengali script letterforms.
    Visual DNA: the matra (horizontal top bar), a vertical stem with oval flag,
    a large enclosed oval form — the building blocks of Bangla consonants.
    Rendered stroke-only so the emboss filter creates the illusion of depth.
  -->
  <defs>
    <filter id="emboss" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <!-- Blur the outline alpha to create soft bevel slopes -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <!-- Shadow: bottom-right, warm dark -->
      <feOffset dx="3.5" dy="3.5" in="blur" result="shadowBlur"/>
      <feFlood flood-color="#7A6855" flood-opacity="0.62" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowBlur" operator="in" result="shadow"/>
      <!-- Highlight: top-left, near-white -->
      <feOffset dx="-3.5" dy="-3.5" in="blur" result="highlightBlur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.88" result="highlightColor"/>
      <feComposite in="highlightColor" in2="highlightBlur" operator="in" result="highlight"/>
      <!-- Merge: shadow → strokes → highlight -->
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="highlight"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#CCC4B8" stroke-linecap="round" stroke-linejoin="round" filter="url(#emboss)">

    <!-- ── Grounding circle — very faint outer ring to anchor the composition ── -->
    <circle cx="250" cy="268" r="212" stroke-width="0.9" stroke-dasharray="4 11"/>

    <!-- ══════════════════════════════════════════════
         MATRA — the defining horizontal top bar of
         Bengali script that connects letterforms
    ══════════════════════════════════════════════ -->
    <line x1="70" y1="158" x2="430" y2="158" stroke-width="6"/>

    <!-- Pre-matra upward hook (the curl at the word's start) -->
    <path d="M70,158 C54,144 51,120 62,104 C71,91 87,92 95,105"
          stroke-width="4" fill="none"/>

    <!-- Right matra terminal — slight downward curl -->
    <path d="M430,158 C444,145 448,128 437,113"
          stroke-width="4" fill="none"/>

    <!-- ══════════════════════════════════════════════
         LEFT LETTERFORM
         Vertical stem descending from matra,
         with a small oval "flag" branching right —
         characteristic of Bengali আ / ব / ড forms
    ══════════════════════════════════════════════ -->

    <!-- Main vertical stem -->
    <path d="M108,158 C108,250 106,320 105,368 C104,392 110,410 122,418 C130,424 142,422 148,414"
          stroke-width="5" fill="none"/>

    <!-- Small oval flag (the enclosed loop branching from the stem) -->
    <path d="M107,235 C121,222 156,226 161,249 C166,272 150,287 107,283"
          stroke-width="3.5" fill="none"/>

    <!-- ══════════════════════════════════════════════
         RIGHT LETTERFORM
         Large enclosed oval — the dominant visual
         element in Bengali consonants like ক হ ত
    ══════════════════════════════════════════════ -->

    <!-- Outer boundary of the large form -->
    <path d="M268,158
             C268,158 204,176 184,230
             C164,284 182,348 226,378
             C258,400 304,402 342,385
             C382,366 408,322 404,274
             C400,226 374,183 336,164
             C314,155 289,153 268,158Z"
          stroke-width="5" fill="none"/>

    <!-- Inner oval — the enclosed "eye" that gives Bengali letters
         their characteristic filled-loop appearance -->
    <ellipse cx="300" cy="284" rx="76" ry="90" stroke-width="3.2"/>

    <!-- Descending tail from the right of the outer form -->
    <path d="M404,274 C417,308 412,354 397,378 C386,396 368,406 352,402"
          stroke-width="3.5" fill="none"/>

    <!-- ══════════════════════════════════════════════
         CONNECTING STROKE
         The mid-level bridge that reads as script
    ══════════════════════════════════════════════ -->
    <path d="M107,281 C148,272 198,268 240,271"
          stroke-width="2.5"/>

    <!-- ══════════════════════════════════════════════
         TERMINAL DOTS — punctuation-like marks
         that finish each stroke end
    ══════════════════════════════════════════════ -->
    <circle cx="70"  cy="158" r="3.5" fill="#CCC4B8" stroke="none"/>
    <circle cx="250" cy="158" r="4.5" fill="#CCC4B8" stroke="none"/>
    <circle cx="430" cy="158" r="3.5" fill="#CCC4B8" stroke="none"/>
    <circle cx="300" cy="284" r="5.5" fill="#CCC4B8" stroke="none"/>

  </g>
</svg>
